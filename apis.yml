name: Faception
description: Faception is an Israeli facial personality analytics company that applies proprietary
  computer vision and machine learning to analyze facial images from photos, video streams, and
  cameras, scoring individuals against personality and behavioral classifiers. The company markets
  its technology to public-safety and smart-city security, fintech, retail, insurance, recruiting,
  and personal-robotics use cases, and states that it analyzes faces anonymously by storing
  mathematical classifiers rather than personal identity data. It was added to the API Evangelist
  network as a portfolio company of 500 Global; at this time it publishes a marketing site and blog
  but no public API, developer documentation, or machine-readable API surface.
